<h2>Sign in to your War Journal</h2>
<p>Enter this code on the sign-in screen:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p>Or, on the device where you want to sign in, <a href="{{ .ConfirmationURL }}">open your journal</a>.</p>
<p style="color:#666">The code and link work once and expire in an hour. If you didn't ask to sign in, you can ignore this email.</p>
